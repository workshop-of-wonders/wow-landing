<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada — Workshop of Wonders</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#380757">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2220%22 font-size=%2220%22>✦</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=DM+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .nf-wrap {
    min-height: 100vh;
    padding-top: calc(var(--nav-h) + var(--space-6));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: var(--purple);
    color: var(--white);
    padding: var(--space-6) var(--page-x);
    gap: var(--space-3);
  }
  .nf-mascot {
    width: min(280px, 60vw);
    height: auto;
    margin-bottom: var(--space-2);
  }
  .nf-code {
    font-family: var(--font-mono);
    letter-spacing: 0.08em;
    color: var(--lima);
    font-size: 1rem;
    text-transform: uppercase;
  }
  .nf-title {
    font-family: var(--font-display);
    font-size: clamp(2rem, 6vw, 3.2rem);
    margin: 0;
  }
  .nf-text {
    font-family: var(--font-body);
    max-width: 480px;
    opacity: 0.85;
    margin: 0;
  }
  .nf-btn {
    margin-top: var(--space-3);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--lima);
    color: var(--purple);
    font-family: var(--font-mono);
    font-weight: 600;
    text-decoration: none;
    padding: 14px 28px;
    border-radius: 999px;
    transition: transform 0.2s ease;
  }
  .nf-btn:hover { transform: translateY(-2px); }
</style>
</head>
<body>

<header class="nav">
  <a href="/" class="logo">
    <img src="design-system/logo/wow-logo-white.webp" alt="Workshop of Wonders" class="logo-img" width="773" height="295">
  </a>
  <nav class="nav-links">
    <a href="/#servicios">Servicios</a>
    <a href="/#labs">Labs</a>
    <a href="/#trabajo">Trabajo</a>
    <a href="/portafolio.html">Portafolio</a>
    <a href="/#contacto" class="btn btn-primary btn-sm">Hablemos de tu proyecto</a>
  </nav>
  <button type="button" class="nav-burger" id="navBurger" aria-label="Abrir menú" aria-expanded="false" aria-controls="navMobileMenu">
    <span></span><span></span><span></span>
  </button>
</header>
<div class="nav-mobile-menu" id="navMobileMenu">
  <div class="nav-mobile-panel">
    <div class="nav-mobile-top">
      <a href="/" class="logo">
        <img src="design-system/logo/wow-logo-white.webp" alt="Workshop of Wonders" class="logo-img" width="773" height="295">
      </a>
      <button type="button" class="nav-mobile-close" id="navMobileClose" aria-label="Cerrar menú">
        <span></span><span></span>
      </button>
    </div>
    <nav class="nav-mobile-links">
      <a href="/#servicios"><span class="nav-mobile-link-num">01</span>Servicios</a>
      <a href="/#labs"><span class="nav-mobile-link-num">02</span>Labs</a>
      <a href="/#trabajo"><span class="nav-mobile-link-num">03</span>Trabajo</a>
      <a href="/portafolio.html"><span class="nav-mobile-link-num">04</span>Portafolio</a>
    </nav>
    <a href="/#contacto" class="btn btn-primary nav-mobile-cta">Hablemos de tu proyecto <span class="nav-mobile-cta-arrow">→</span></a>
  </div>
</div>

<main class="nf-wrap">
  <img src="design-system/404/mascota-404.png" alt="Mascota de Workshop of Wonders confundida" class="nf-mascot" width="280" height="280">
  <span class="nf-code">Error 404</span>
  <h1 class="nf-title">Esta página se perdió en el taller</h1>
  <p class="nf-text">No encontramos lo que buscabas, pero seguro tenemos algo mejor esperándote en el inicio.</p>
  <a href="/" class="nf-btn">Volver al inicio →</a>
</main>

<script>
(function () {
  var burger = document.getElementById('navBurger');
  var menu = document.getElementById('navMobileMenu');
  var closeBtn = document.getElementById('navMobileClose');
  if (!burger || !menu) return;
  function setOpen(isOpen) {
    burger.classList.toggle('is-open', isOpen);
    burger.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    menu.classList.toggle('is-open', isOpen);
    document.body.style.overflow = isOpen ? 'hidden' : '';
  }
  burger.addEventListener('click', function () {
    setOpen(!menu.classList.contains('is-open'));
  });
  if (closeBtn) closeBtn.addEventListener('click', function () { setOpen(false); });
  menu.addEventListener('click', function (e) {
    if (e.target === menu) setOpen(false);
  });
  menu.querySelectorAll('a').forEach(function (a) {
    a.addEventListener('click', function () { setOpen(false); });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') setOpen(false);
  });
})();
</script>
</body>
</html>
